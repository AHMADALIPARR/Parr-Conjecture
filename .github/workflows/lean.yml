name: Lean CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and build with Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          # Automatically uses lean-toolchain from the repo
          # and caches Mathlib oleans aggressively
