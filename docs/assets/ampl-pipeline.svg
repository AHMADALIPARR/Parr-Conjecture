<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="AMPL model to NL pipeline">
  <rect width="920" height="420" fill="#0f172a"/>
  <text x="460" y="30" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">AMPL Contract Model to .nl Intermediate</text>
  <rect x="30" y="70" width="140" height="70" rx="6" fill="#1e293b" stroke="#fb7185"/>
  <text x="100" y="100" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="12" font-weight="600">.mod</text>
  <text x="100" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">params · vars · cons</text>
  <rect x="200" y="70" width="140" height="70" rx="6" fill="#1e293b" stroke="#fb7185"/>
  <text x="270" y="100" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="12" font-weight="600">.dat</text>
  <text x="270" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">N_E=4 · X0 Y0 C</text>
  <rect x="370" y="70" width="140" height="70" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="440" y="100" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">.run</text>
  <text x="440" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">model; data; write g</text>
  <rect x="540" y="70" width="160" height="70" rx="6" fill="#1e293b" stroke="#34d399"/>
  <text x="620" y="100" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">.nl IR</text>
  <text x="620" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">7 vars · 9 cons · 1 obj</text>
  <rect x="730" y="70" width="160" height="70" rx="6" fill="#1e293b" stroke="#60a5fa"/>
  <text x="810" y="100" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Solver target</text>
  <text x="810" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Ipopt (declared)</text>
  <rect x="30" y="180" width="860" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="210" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Expanded contracts (from AMPL/GKN_E7_Bridge.mod)</text>
  <text x="50" y="240" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">E7_Shift_I4_Invariance: |I4_shifted - I4_base| <= 1e-9</text>
  <text x="50" y="265" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">QEC_SingleBitError_Budget · Legendre_Fenchel_Young · Logit_Gate · Simplex · Montgomery_R2</text>
  <text x="50" y="295" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Instance residual |I4_s - I4_b| = 1.78e-15 · R2(0.5) = 0.594715</text>
  <text x="50" y="325" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Note: .nl is structured emission from .mod+.dat; AMPL binary not present in CI environment</text>
  <text x="460" y="400" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">docs/assets/ampl-pipeline.svg</text>
</svg>
